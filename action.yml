name: grounded-lint
description: Find dangling references in code comments, with PR annotations, baselines, and SARIF output
inputs:
  path:
    description: Directory to scan
    default: .
  version:
    description: grounded version to install (PyPI) or 'source' for the action checkout
    default: ''
  fail-on:
    description: Minimum severity that fails the run
    default: lie
  baseline:
    description: Baseline file for delta gating (optional)
    default: ''
  changed-base:
    description: Report only findings on lines changed vs this ref (empty disables)
    default: ''
  sarif-file:
    description: Path to write SARIF output for GitHub Code Scanning (optional)
    default: ''
  config:
    description: Explicit config file path (grounded.toml / pyproject.toml)
    default: ''
  enable:
    description: Comma-separated checker IDs to run exclusively (optional)
    default: ''
  disable:
    description: Comma-separated checker IDs to skip (optional)
    default: ''
  summary:
    description: Write a Markdown findings table to the job summary ('true' or 'false')
    default: 'true'
  pr-comment:
    description: Maintain one PR comment with the findings table (pull_request events only, 'true' or 'false')
    default: 'false'
runs:
  using: composite
  steps:
    - name: Install grounded
      shell: bash
      run: |
        if [ "${{ inputs.version }}" = "source" ]; then
          pip install "${{ github.action_path }}"
        elif [ -n "${{ inputs.version }}" ]; then
          pip install "grounded-lint==${{ inputs.version }}"
        else
          pip install grounded-lint
        fi
    - name: Register problem matchers
      shell: bash
      run: echo "::add-matcher::${{ github.action_path }}/.github/grounded-problem-matcher.json"
    - name: Scan
      shell: bash
      # NOTE: hyphenated input names REQUIRE bracket notation here.
      # `inputs.fail-on` parses as arithmetic (fail minus on) and
      # silently expands to empty, which broke v0.3.0's first live run.
      run: |
        ARGS=("${{ inputs.path }}" --fail-on "${{ inputs['fail-on'] }}" --no-color)
        [ -n "${{ inputs.baseline }}" ] && ARGS+=(--baseline "${{ inputs.baseline }}")
        [ -n "${{ inputs['changed-base'] }}" ] && ARGS+=(--changed "${{ inputs['changed-base'] }}")
        [ -n "${{ inputs.config }}" ] && ARGS+=(--config "${{ inputs.config }}")
        [ -n "${{ inputs.enable }}" ] && ARGS+=(--enable "${{ inputs.enable }}")
        [ -n "${{ inputs.disable }}" ] && ARGS+=(--disable "${{ inputs.disable }}")

        if [ -n "${{ inputs['sarif-file'] }}" ]; then
          grounded scan "${ARGS[@]}" --format sarif --output "${{ inputs['sarif-file'] }}" || true
        fi

        if [ "${{ inputs.summary }}" = "true" ] && [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          grounded scan "${ARGS[@]}" --format markdown >> "$GITHUB_STEP_SUMMARY" || true
        fi

        if [ "${{ inputs['pr-comment'] }}" = "true" ] && [ "${GITHUB_EVENT_NAME:-}" = "pull_request" ]; then
          # Needs `permissions: pull-requests: write` on the calling workflow,
          # plus python3 and gh (both preinstalled on GitHub runners).
          REPORT="$(mktemp)"
          COUNT="$(grounded scan "${ARGS[@]}" --format json 2>/dev/null | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))' 2>/dev/null || echo SKIP)"
          if [ "$COUNT" = "SKIP" ]; then
            # The scan itself broke: say nothing here (the final
            # `grounded scan` below still fails the job). Posting
            # "clean" over a broken scan would be a lie.
            :
          else
            {
              echo "<!-- grounded-report -->"
              if [ "$COUNT" -gt 0 ] 2>/dev/null; then
                echo "## Grounded found ${COUNT} dangling reference(s)"
                echo ""
                grounded scan "${ARGS[@]}" --format markdown || true
                echo ""
                echo "_Reported by [Grounded](https://github.com/gonisulaimann/Grounded) — claim, evidence, and fix on every line._"
              else
                echo "## Grounded: clean"
                echo ""
                echo "_No dangling references in scope. Previously reported findings are resolved._"
              fi
            } > "$REPORT"
            # One maintained comment, never a thread: update the existing
            # grounded-report comment if present, else create it.
            EXISTING="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.pull_request.number }}/comments" --paginate -q '.[] | select((.body // "") | contains("<!-- grounded-report -->")) | .id' 2>/dev/null | head -1)"
            if [ -n "$EXISTING" ]; then
              gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${EXISTING}" -F "body=@${REPORT}" >/dev/null || true
            else
              gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.pull_request.number }}/comments" -F "body=@${REPORT}" >/dev/null || true
            fi
          fi
          rm -f "$REPORT"
        fi

        grounded scan "${ARGS[@]}"
branding:
  icon: search
  color: blue
