name: grounded
description: Find dangling references in code comments
inputs:
  path:
    description: Directory to scan
    default: .
  version:
    description: grounded version to install (PyPI) or 'source' for the action checkout
    default: ''
  fail-on:
    description: Minimum severity that fails the run
    default: lie
  baseline:
    description: Baseline file for delta gating (optional)
    default: ''
  changed-base:
    description: Report only findings on lines changed vs this ref (empty disables)
    default: ''
runs:
  using: composite
  steps:
    - name: Install grounded
      shell: bash
      run: |
        if [ "${{ inputs.version }}" = "source" ]; then
          pip install "${{ github.action_path }}"
        elif [ -n "${{ inputs.version }}" ]; then
          pip install "grounded==${{ inputs.version }}"
        else
          pip install grounded
        fi
    - name: Register problem matchers
      shell: bash
      run: echo "::add-matcher::${{ github.action_path }}/.github/grounded-problem-matcher.json"
    - name: Scan
      shell: bash
      # NOTE: hyphenated input names REQUIRE bracket notation here.
      # `inputs.fail-on` parses as arithmetic (fail minus on) and
      # silently expands to empty, which broke v0.3.0's first live run.
      run: |
        ARGS=("${{ inputs.path }}" --fail-on "${{ inputs['fail-on'] }}" --no-color)
        [ -n "${{ inputs.baseline }}" ] && ARGS+=(--baseline "${{ inputs.baseline }}")
        [ -n "${{ inputs['changed-base'] }}" ] && ARGS+=(--changed "${{ inputs['changed-base'] }}")
        grounded scan "${ARGS[@]}"
branding:
  icon: search
  color: blue
