name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Standalone tests (stdlib unittest without install)
        run: python -m unittest discover -s tests
      - name: Install
        run: pip install -e .
      - name: Tests (stdlib unittest with package)
        run: python -m unittest discover -s tests
      - name: Dogfood gate (self-scan must stay clean)
        run: grounded scan src --no-color
      - name: Demo fixtures still diagnosed
        run: test "$(grounded scan examples/v2demo --format json | python -c 'import json,sys; print(len(json.load(sys.stdin)))')" = "10"
