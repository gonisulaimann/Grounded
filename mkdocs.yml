site_name: Grounded
site_description: The deterministic reference & import integrity firewall for code and AI coding agents.
site_author: Goni Sulaiman
site_url: https://grounded-lint.readthedocs.io/

repo_name: gonisulaimann/Grounded
repo_url: https://github.com/gonisulaimann/Grounded

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - tables
  - attr_list

nav:
  - Overview: index.md
  - Quickstart: quickstart.md
  - Installation: installation.md
  - Rules & Checkers: rules.md
  - Configuration: configuration.md
  - CLI reference: cli-reference.md
  - Agent & Editor Setup: agents.md
  - VS Code / Cursor Extension: editors.md
  - Agent Skill: agent-skill.md
  - Architecture: internals.md
  - Benchmarks: benchmarks.md
  - Registry Grid: registry.md
  - Roadmap: roadmap.md
  - FAQ: faq.md
