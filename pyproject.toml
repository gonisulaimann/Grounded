[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grounded-lint"
version = "0.17.0"
description = "Reference integrity firewall for code and AI agents. Deterministic, offline, zero dependencies."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["lint", "linter", "static-analysis", "comments", "documentation",
             "documentation-rot", "code-quality", "ai-agents", "mcp", "lsp",
             "hallucination", "tech-debt"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Documentation",
]

[project.scripts]
grounded = "grounded.cli:main"

[project.urls]
Homepage = "https://github.com/gonisulaimann/Grounded"
Changelog = "https://github.com/gonisulaimann/Grounded/blob/main/CHANGELOG.md"
Documentation = "https://grounded.readthedocs.io"
"Bug Tracker" = "https://github.com/gonisulaimann/Grounded/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
grounded = ["py.typed", "skill/SKILL.md", "skill/references/*.md", "skill/examples/*.md"]

[tool.grounded]
fail_on = "lie"

# Dev-only tools (benchmarks, GIF rendering). Declared so phantom-package
# stays silent on purpose, not by accident.
[dependency-groups]
dev = ["pillow", "pytest"]
